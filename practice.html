  <body style="visibility: hidden" onLoad="document.body.style.visibility='visible'">
    <div class="container pb-5">
      <nav class="navbar bg-light site-nav">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">VisualCube Editor 2.0</a>
          <!-- 右側：広い画面では 言語・アカウント・ページへのリンク・GitHub を1行に並べる。
               スマホではアカウントとメニューのボタンだけを出し、言語とリンクはメニューの中に入れる（js/navbar.js） -->
          <div class="nav-right">
            <span id="accountBox"></span>
            <button type="button" class="nav-toggle" id="navToggle" aria-controls="navMenu" aria-expanded="false" data-i18n-aria-label="nav.menu" aria-label="Menu">
              <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
            </button>
            <div class="nav-menu" id="navMenu">
              <span id="langSwitch"></span>
              <a href="/" class="nav-link-item" data-i18n="nav.editor">Editor</a>
              <a href="/pll" class="nav-link-item" data-i18n="nav.pllList">PLL List</a>
              <a href="/oll" class="nav-link-item" data-i18n="nav.ollList">OLL List</a>
              <a href="/practice" class="nav-link-item" data-i18n="nav.practice" aria-current="page">Practice</a>
              <a href="/stats" class="nav-link-item" data-i18n="nav.stats">Stats</a>
              <a href="https://github.com/roudai/VisualCubeEditor2" class="nav-link-item nav-github" aria-label="GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z" /></svg>
              </a>
            </div>
          </div>
        </div>
      </nav>
      <div class="d-flex justify-content-end text-muted small">presented by&nbsp;<a href="https://roudai.net" style="text-decoration: none">roudai.net</a></div>


      <div class="d-flex flex-wrap align-items-center gap-3 mt-3 mb-3">
        <h1 class="h4 m-0" data-i18n="practice.heading">Practice</h1>
        <!-- 種類（PLL / OLL / 通し）。js/practice.js が作る -->
        <div id="practiceSetBox" class="d-flex flex-wrap align-items-center gap-2"></div>
      </div>

      <!-- 設定（js/practice.js が作る） -->
      <section id="practiceSettings" class="practice-settings"></section>

      <!-- 出題とタイマー -->
      <section id="practiceStage" class="practice-stage mt-3">
        <div class="practice-label" data-i18n="practice.scramble">Scramble</div>
        <div id="scramble" class="practice-scramble"></div>
        <!-- PLL / OLL：解き終わったケース（PLL Aa など）。タイマーにタイムを出している間だけ（js/practice.js） -->
        <div id="solvedCase" class="practice-solved" aria-live="polite"></div>
        <button id="timer" type="button" class="practice-timer" aria-live="off">0.00</button>
        <div id="timerHint" class="practice-hint" data-i18n="practice.hint">Space to start, any key to stop (tap on phones)</div>
        <div class="d-flex justify-content-center gap-2 mt-2">
          <button id="dnfButton" type="button" class="btn btn-sm btn-outline-danger" data-i18n="practice.dnf">Couldn't solve</button>
          <button id="skipButton" type="button" class="btn btn-sm btn-outline-secondary" data-i18n="practice.skip">Skip</button>
          <button id="hintButton" type="button" class="btn btn-sm btn-outline-secondary" data-i18n="practice.hintButton">Hint</button>
        </div>
        <div id="practiceHintText" class="practice-hint-text" aria-live="polite"></div>
        <div id="practiceEmpty" class="practice-empty" data-i18n="practice.empty" hidden>No cases match. Change the target.</div>
      </section>

      <!-- 結果 -->
      <section id="practiceResult" class="practice-result mt-3" hidden></section>

      <!-- 直近の記録 -->
      <section class="mt-3">
        <!-- 通しの ao5・ao12・ベスト（js/practice.js） -->
        <div id="practiceFullStats" class="practice-full-stats mb-2" hidden></div>
        <div class="d-flex align-items-baseline gap-3">
          <h2 class="h6 text-muted" data-i18n="practice.history">Recent results</h2>
          <a href="/stats" id="allStatsLink" class="small" data-i18n="practice.allStats">See all stats</a>
        </div>
        <ol id="practiceHistory" class="practice-history"></ol>
      </section>
    </div>
    <script src="js/store.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/navbar.js"></script>
    <script src="library/srVisualizer.min.js"></script>
    <script src="js/cube-state.js"></script>
    <script src="js/cube-draw.js"></script>
    <script src="js/pll-data.js"></script>
    <script src="js/oll-data.js"></script>
    <script src="js/coll-data.js"></script>
    <script src="js/pll-scrambles.js"></script>
    <script src="js/oll-scrambles.js"></script>
    <script src="js/coll-scrambles.js"></script>
    <script src="js/pll-groups.js"></script>
    <script src="js/oll-groups.js"></script>
    <script src="js/coll-groups.js"></script>
    <script src="js/case-sections.js"></script>
    <script src="js/case-check.js"></script>
    <script src="js/custom-algs.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/cube-solver.js"></script>
    <script src="js/wca-scramble.js"></script>
    <script src="js/practice.js"></script>
    <script src="js/firebase-config.js"></script>
    <script type="module" src="js/cloud-sync.js"></script>
  </body>
</html>
