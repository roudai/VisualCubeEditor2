<!DOCTYPE html>
<html lang="ja" data-i18n-title-page="title.zbllList">
  <head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // JS で中身を作り終えるまで見せない（英語の仮の文字・空の一覧が一瞬出てちらつくのを防ぐ。css/common.css の html.booting）。
      // body の最後のスクリプトを全部実行したあと（DOMContentLoaded）に見せる。極端に遅いときも 3 秒で見せる
      document.documentElement.classList.add('booting');
      (function () {
        var show = function () { document.documentElement.classList.remove('booting'); };
        document.addEventListener('DOMContentLoaded', show);
        setTimeout(show, 3000);
      })();
    </script>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/cases.css" />
    <link rel="shortcut icon" href="favicon/icon.ico" />
    <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="favicon/android-chrome-192×192.png" />
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2LP5F7RVYQ"></script>
    <script>
      window.dataLayer = window.dataLayer || []

      }
      gtag('js', new Date())
      gtag('config', 'G-2LP5F7RVYQ')
    </script>
    <title>ZBLL - VisualCube Editor 3.0</title>
  </head>

    <div class="container pb-5">
      <nav class="navbar bg-light site-nav">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">VisualCube Editor 3.0</a>

               スマホではアカウントとメニューのボタンだけを出し、言語とリンクはメニューの中に入れる（js/navbar.js） -->
          <div class="nav-right">
            <span id="accountBox"></span>
            <button type="button" class="nav-toggle" id="navToggle" aria-controls="navMenu" aria-expanded="false" data-i18n-aria-label="nav.menu" aria-label="Menu">

            </button>
            <div class="nav-menu" id="navMenu">

              <a href="/" class="nav-link-item" data-i18n="nav.editor">Editor</a>
              <a href="/pll" class="nav-link-item" data-i18n="nav.pllList">PLL</a>
              <a href="/oll" class="nav-link-item" data-i18n="nav.ollList">OLL</a>

              </a>
            </div>
          </div>
        </div>
      </nav>

      <h1 class="h4 mt-3"><span data-i18n="list.zbllHeading">ZBLL</span> <small id="caseCount" class="text-muted fs-6"></small></h1>
      <p class="text-muted small mb-2" data-i18n="list.zbllIntro">Solve the whole last layer at once when the edges are already oriented (472 cases in 7 OCLL sets). Click a case to open it in the editor. Click the circle to mark your progress.</p>
      <a id="practiceLink" href="/practice" class="btn btn-primary btn-sm mb-2 me-1" data-i18n="practice.listButton" data-i18n-title="practice.listButtonTitle">Practice</a>
      <button id="downloadZip" type="button" class="btn btn-outline-secondary btn-sm mb-2 d-none d-md-inline-block" title="472 cases as PNG, with the colors shown here and the image settings saved in the editor">Download ZIP</button>
      <!-- ZIP でダウンロードの確認（押してすぐにはダウンロードしない。js/cases.js の renderZipConfirm） -->
      <div id="zipConfirm" class="zip-confirm d-none d-md-flex" hidden></div>
      <div id="progressBox"></div>
      <div id="groupNav" class="mb-1"></div>
      <div id="caseList"></div>
    </div>
    <script src="js/store.js"></script>
