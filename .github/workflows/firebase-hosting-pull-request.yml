# プルリクエストごとに、Firebase Hosting のプレビューチャンネルへテスト用のページを公開する（本番は今までどおり GitHub Pages）。
#   - 公開する中身・URL の形は firebase.json（.html なしの URL で開ける。data・reference・test・tools は載せない）
#   - URL はプルリクエストにコメントで付く。push するたびに同じ URL を更新し、7 日で消える
#   - Megaminx Image Editor と同じ Firebase プロジェクト・同じサイトに公開するので、チャンネル名を vce2-pr<番号> にして重ならないようにする
#   - 鍵はリポジトリの Secrets の FIREBASE_SERVICE_ACCOUNT_ROUDAINET_CUBE_TOOLS（Firebase のサービスアカウントの鍵。手で登録する）
#   - フォークからのプルリクエストは Secrets が使えないので動かさない
# 使うアクションはコミット（SHA）で固定する（タグは作者が中身を差し替えられるので、乗っ取られるとサービスアカウントの鍵が抜かれるため）。
# 更新するときは、新しいリリースのタグが指すコミットを確かめてから SHA とコメントのバージョンを書き換える
# テスト用のページは本番と同じ Firebase プロジェクトにつながり、ログインもできる。プレビューの URL（roudainet-cube-tools--vce2-pr<番号>-….web.app）は、
# 公開のときに Firebase CLI が Authentication の承認済みドメインに自動で足し、期限切れのチャンネルの URL は次の公開のときに消す
# （firebase-tools の hosting-channel-deploy の addAuthDomains・cleanAuthState）。
# そのため、このサービスアカウントは Authentication の管理の権限（全ユーザーの名前・メールアドレスも読める）を持つ。
# 鍵（Secrets）が漏れるとユーザーの情報が抜かれるので、アクションを SHA で固定し、鍵を外に出さない。
# ログインすると本番のアカウントのデータを読み書きするので、保存の仕方を変えるときは気をつける。ログインしなければブラウザの保存だけで動く
name: Deploy preview to Firebase Hosting
on:
  pull_request:
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUDAINET_CUBE_TOOLS }}
          projectId: roudainet-cube-tools
          channelId: vce2-pr${{ github.event.pull_request.number }}
          expires: 7d
